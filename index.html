<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101114">
<meta name="description" content="Burmalgram — современный web-мессенджер">
<title>Burmalgram</title>
<style>
:root{--bg:#0b0c10;--panel:#101217;--panel2:#171920;--panel3:#1d2029;--line:#292d37;--text:#f4f5f7;--muted:#8e94a2;--accent:#6b5cff;--accent2:#8c7fff;--danger:#ef6670;--ok:#42d39a;--shadow:0 24px 80px rgba(0,0,0,.42);--bubble:#1b2029;--bubble-me:#5548d7}
html.light{--bg:#f4f5f8;--panel:#fff;--panel2:#f0f1f5;--panel3:#e8eaf0;--line:#d9dce4;--text:#16181d;--muted:#6f7480;--accent:#5f50dd;--accent2:#796eff;--danger:#d94855;--ok:#1caa77;--shadow:0 24px 80px rgba(23,27,35,.18);--bubble:#eceef3;--bubble-me:#6a5fe2}
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}.hidden{display:none!important}
.app{height:100dvh;display:grid;grid-template-columns:350px minmax(0,1fr);background:radial-gradient(1100px 700px at 8% 0,rgba(107,92,255,.12),transparent 50%),var(--bg)}
.sidebar{background:color-mix(in srgb,var(--panel) 88%,transparent);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;backdrop-filter:blur(18px)}
.brandbar{height:72px;display:flex;align-items:center;gap:12px;padding:0 16px;border-bottom:1px solid var(--line)}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#a26cff);display:grid;place-items:center;box-shadow:0 10px 30px rgba(107,92,255,.28);flex:none}.logo svg{width:23px}.brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-size:11px;font-weight:500;margin-top:2px}.brand-actions{margin-left:auto;display:flex;gap:4px}
.iconbtn{width:38px;height:38px;border:0;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--muted);transition:.16s}.iconbtn:hover{background:var(--panel2);color:var(--text)}.iconbtn:active{transform:scale(.96)}
.search{padding:12px 14px 8px}.searchbox{height:42px;border:1px solid var(--line);background:var(--bg);border-radius:13px;display:flex;align-items:center;gap:8px;padding:0 12px}.searchbox svg{width:17px;color:var(--muted)}.searchbox input{width:100%;border:0;outline:0;background:transparent;color:var(--text)}.searchbox input::placeholder{color:var(--muted)}
.filters{display:flex;gap:7px;padding:7px 14px 10px}.chip{padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);color:var(--muted);font-size:12px}.chip.active{color:#fff;background:color-mix(in srgb,var(--accent) 20%,var(--panel2));border-color:color-mix(in srgb,var(--accent) 55%,var(--line))}
.chatlist{overflow:auto;padding:3px 8px 12px}.chatitem{display:flex;gap:11px;align-items:center;padding:10px;border-radius:13px;transition:.16s;cursor:pointer}.chatitem:hover{background:var(--panel2)}.chatitem.active{background:color-mix(in srgb,var(--accent) 16%,var(--panel2));outline:1px solid color-mix(in srgb,var(--accent) 20%,transparent)}.avatar{width:47px;height:47px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,#303544,#1c2029);color:#fff;font-weight:800;flex:none}.chatmeta{min-width:0;flex:1}.chatline{display:flex;gap:8px;align-items:center}.chatname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatdate{margin-left:auto;font-size:11px;color:var(--muted)}.preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{min-width:21px;height:21px;border-radius:999px;display:grid;place-items:center;background:var(--accent);font-size:11px;font-weight:800}
.profilebar{padding:10px 12px;border-top:1px solid var(--line);display:flex;align-items:center;gap:10px;cursor:pointer}.profilebar:hover{background:var(--panel2)}.profilebar .mini{width:38px;height:38px;border-radius:12px;font-size:13px}.grow{flex:1;min-width:0}.me-name{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.me-user{font-size:12px;color:var(--muted);margin-top:2px}
.main{min-width:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent 40%),var(--bg)}.topbar{height:72px;display:flex;align-items:center;gap:11px;padding:0 18px;border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(18px)}.back{display:none}.topavatar{width:42px;height:42px;border-radius:13px}.topname{font-weight:800}.topstatus{font-size:12px;color:var(--muted);margin-top:2px}.topactions{margin-left:auto;display:flex;gap:4px}.messages{flex:1;overflow:auto;padding:26px clamp(18px,6vw,88px);display:flex;flex-direction:column;gap:8px}.empty{margin:auto;text-align:center;color:var(--muted);max-width:420px}.empty h2{color:var(--text);margin:0 0 8px}.system{align-self:center;color:var(--muted);background:var(--panel2);border:1px solid var(--line);padding:5px 10px;border-radius:999px;font-size:11px}.msgrow{display:flex;gap:8px;align-items:flex-end;max-width:78%;animation:rise .18s ease}.msgrow.me{margin-left:auto;flex-direction:row-reverse}.msgavatar{width:31px;height:31px;border-radius:10px;font-size:10px}.bubble{padding:10px 12px;border-radius:17px 17px 17px 5px;background:var(--bubble);border:1px solid var(--line);box-shadow:0 7px 22px rgba(0,0,0,.09)}.me .bubble{background:linear-gradient(135deg,var(--bubble-me),#6f66eb);border-color:transparent;border-radius:17px 17px 5px 17px}.msgtext{line-height:1.42;white-space:pre-wrap;word-break:break-word}.msgsub{display:flex;justify-content:flex-end;gap:7px;margin-top:4px;font-size:10px;color:var(--muted)}.me .msgsub{color:#e7e3ff}.composer{padding:11px clamp(18px,6vw,88px) 17px;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(16px)}.composebox{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:7px}.composebox textarea{flex:1;min-height:42px;max-height:130px;resize:none;border:0;outline:0;background:transparent;color:var(--text);padding:9px 7px;line-height:1.4}.send{width:42px;height:42px;border:0;border-radius:13px;background:var(--accent);display:grid;place-items:center;font-size:18px;box-shadow:0 10px 25px rgba(107,92,255,.25)}.send:disabled{opacity:.38;box-shadow:none}
.modalwrap{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.58);backdrop-filter:blur(12px);display:grid;place-items:center;padding:14px}.modal{width:min(620px,100%);max-height:min(84dvh,780px);display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;animation:pop .18s ease}.modalhead{display:flex;align-items:center;gap:10px;padding:17px 20px;border-bottom:1px solid var(--line)}.modalhead h3{margin:0;font-size:18px}.modalbody{padding:19px 20px;overflow:auto}.modalfoot{display:flex;justify-content:flex-end;gap:8px;padding:13px 20px;border-top:1px solid var(--line)}
.formgrid{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);outline:0;padding:12px 13px}.field textarea{min-height:92px;resize:vertical}.row{display:flex;gap:9px}.primary,.secondary,.danger{padding:11px 15px;border-radius:12px;font-weight:700}.primary{border:0;background:var(--accent)}.secondary{background:var(--panel2);border:1px solid var(--line)}.danger{background:rgba(239,102,112,.12);border:1px solid rgba(239,102,112,.25);color:#ff9da4}.divider{height:1px;background:var(--line);margin:17px 0}.setting{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:13px 0;border-bottom:1px solid var(--line)}.setting:last-child{border-bottom:0}.setting b{display:block}.setting span{display:block;font-size:12px;color:var(--muted);margin-top:4px}.toggle{width:45px;height:26px;border:0;border-radius:99px;background:#343945;padding:3px}.toggle:before{content:"";display:block;width:20px;height:20px;border-radius:50%;background:#b0b5c0;transition:.16s}.toggle.on{background:var(--accent)}.toggle.on:before{transform:translateX(19px);background:#fff}.section-title{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin:3px 0 7px}.profilehero{display:flex;align-items:center;gap:14px;padding-bottom:14px}.bigavatar{width:68px;height:68px;border-radius:20px;font-size:20px}.result{display:flex;align-items:center;gap:11px;padding:10px;border-radius:12px}.result:hover{background:var(--panel2)}.result .small{font-size:12px;color:var(--muted)}.check{margin-left:auto;width:20px;height:20px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center}.result.selected .check{background:var(--accent);border-color:var(--accent)}
.auth{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:18px;background:radial-gradient(900px 600px at 15% 10%,rgba(107,92,255,.2),transparent 50%),var(--bg)}.authcard{width:min(470px,100%);padding:32px;border:1px solid var(--line);border-radius:26px;background:color-mix(in srgb,var(--panel) 92%,transparent);box-shadow:var(--shadow);backdrop-filter:blur(18px);animation:pop .22s ease}.authlogo{width:58px;height:58px;border-radius:18px;margin-bottom:16px}.authcard h1{margin:0;font-size:30px}.authcard p{margin:7px 0 22px;color:var(--muted)}.google{width:100%;height:48px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);font-weight:700}.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:11px;margin:16px 0}.or:before,.or:after{content:"";height:1px;background:var(--line);flex:1}.authcard .primary{width:100%;height:48px}.switch{text-align:center;color:var(--muted);font-size:13px;margin-top:16px}.link{color:#bdb7ff;cursor:pointer}.hint{color:var(--muted);font-size:11px;line-height:1.5;margin-top:12px}
.toast{position:fixed;right:17px;bottom:17px;z-index:60;max-width:390px;padding:12px 14px;border-radius:13px;background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);animation:rise .18s ease}.toast.error{border-color:rgba(239,102,112,.45)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:860px){.app{grid-template-columns:1fr}.sidebar{position:absolute;z-index:5;inset:0;width:100%;transition:.23s}.app.chatopen .sidebar{transform:translateX(-100%)}.back{display:grid}.messages{padding:19px 12px}.composer{padding:10px 12px 14px}.msgrow{max-width:90%}}
@media(max-width:560px){.brandbar{height:66px}.modal{border-radius:20px}.modalwrap{padding:7px}.authcard{padding:23px}.topbar{padding:0 11px}.topactions .optional{display:none!important}}
</style>
</head>
<body>
<div id="auth" class="auth hidden"></div>
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brandbar">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6.5C5 5.12 6.12 4 7.5 4h9C17.88 4 19 5.12 19 6.5v8c0 1.38-1.12 2.5-2.5 2.5H13l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 14.5v-8Z" fill="white"/><path d="M9 9h6M9 12h4" stroke="#6d5dfc" stroke-width="1.7" stroke-linecap="round"/></svg></div>
      <div class="brand">Burmalgram<small>Связь без лишнего</small></div>
      <div class="brand-actions"><button class="iconbtn" id="newChatBtn" title="Новый чат">＋</button></div>
    </div>
    <div class="search"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="searchInput" placeholder="Поиск"></div></div>
    <div class="filters"><button class="chip active" data-filter="all">Все</button><button class="chip" data-filter="dm">Личные</button><button class="chip" data-filter="group">Группы</button><button class="chip" data-filter="channel">Каналы</button></div>
    <div id="chatList" class="chatlist"></div>
    <div id="profileBar" class="profilebar"><div id="meAvatar" class="avatar mini">B</div><div class="grow"><div id="meName" class="me-name">Профиль</div><div id="meUser" class="me-user">@user</div></div><button class="iconbtn" id="settingsBtn" title="Настройки">⚙</button></div>
  </aside>
  <main class="main">
    <header class="topbar"><button class="iconbtn back" id="backBtn">‹</button><div id="topAvatar" class="avatar topavatar">B</div><div class="grow"><div id="topName" class="topname">Выберите чат</div><div id="topStatus" class="topstatus">Здесь будут ваши сообщения</div></div><div class="topactions"><button class="iconbtn optional" id="searchChatBtn" title="Поиск">⌕</button><button class="iconbtn" id="chatInfoBtn" title="Информация">⋯</button></div></header>
    <section id="messages" class="messages"><div class="empty"><h2>Добро пожаловать в Burmalgram</h2><div>Откройте новый чат или создайте группу/канал.</div></div></section>
    <div class="composer"><div class="composebox"><textarea id="messageInput" rows="1" placeholder="Написать сообщение…" disabled></textarea><button class="send" id="sendBtn" disabled>➤</button></div></div>
  </main>
</div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signInWithPopup,GoogleAuthProvider,updateProfile,signOut} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
import {getFirestore,doc,getDoc,setDoc,addDoc,updateDoc,collection,query,where,orderBy,onSnapshot,serverTimestamp,limit,getDocs,arrayUnion} from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';

const firebaseConfig={apiKey:'AIzaSyAjftpHgU757wxDsVsm3fOprRF2UGfPCJk',authDomain:'burmalgram-91a54.firebaseapp.com',projectId:'burmalgram-91a54',storageBucket:'burmalgram-91a54.firebasestorage.app',messagingSenderId:'322071333189'};
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),google=new GoogleAuthProvider();
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const state={user:null,profile:null,chats:[],activeChat:null,chatsUnsub:null,msgUnsub:null,users:new Map(),filter:'all',search:'',blocked:new Set(),selectedMembers:new Map()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const initials=v=>(String(v||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'?').toUpperCase();
const dt=ts=>ts?.toDate?.()||null;
function time(ts){const d=dt(ts);if(!d)return'';const n=new Date();return d.toDateString()===n.toDateString()?d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'});}
function longTime(ts){const d=dt(ts);return d?d.toLocaleString('ru-RU',{day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'}):''}
function av(name,cls='avatar'){return `<div class="${cls}">${esc(initials(name))}</div>`}
function toast(text,error=false){const e=document.createElement('div');e.className='toast'+(error?' error':'');e.textContent=text;$('#toastRoot').append(e);setTimeout(()=>e.remove(),4000)}
function closeModal(){ $('#modalRoot').innerHTML='' }
function modal(title,body,footer=''){ $('#modalRoot').innerHTML=`<div class="modalwrap" id="modalWrap"><div class="modal"><div class="modalhead"><h3>${esc(title)}</h3><button class="iconbtn" id="modalClose">×</button></div><div class="modalbody">${body}</div>${footer?`<div class="modalfoot">${footer}</div>`:''}</div></div>`;$('#modalClose').onclick=closeModal;$('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')closeModal()}; }
function authErr(e){const m={'auth/invalid-credential':'Неверная почта или пароль.','auth/email-already-in-use':'Эта почта уже зарегистрирована.','auth/weak-password':'Пароль слишком простой.','auth/invalid-email':'Некорректная почта.','auth/popup-closed-by-user':'Окно Google закрыто.','auth/popup-blocked':'Браузер заблокировал окно Google.','permission-denied':'Firebase: нет доступа. Проверьте Firestore Rules.','auth/unauthorized-domain':'Добавьте адрес сайта в Firebase → Authentication → Settings → Authorized domains.'};return m[e?.code]||e?.message||'Не удалось выполнить действие.'}

function authView(mode='login'){const reg=mode==='register';$('#auth').innerHTML=`<div class="authcard"><div class="logo authlogo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6.5C5 5.12 6.12 4 7.5 4h9C17.88 4 19 5.12 19 6.5v8c0 1.38-1.12 2.5-2.5 2.5H13l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 14.5v-8Z" fill="white"/><path d="M9 9h6M9 12h4" stroke="#6d5dfc" stroke-width="1.7" stroke-linecap="round"/></svg></div><h1>${reg?'Создать аккаунт':'С возвращением'}</h1><p>${reg?'Зарегистрируйтесь в Burmalgram.':'Войдите в свой аккаунт.'}</p><button class="google" id="googleBtn">G&nbsp;&nbsp; Продолжить с Google</button><div class="or">или</div><form id="authForm" class="formgrid">${reg?'<div class="field"><label>Имя</label><input id="name" required minlength="2" maxlength="40" placeholder="Ваше имя"></div>':''}<div class="field"><label>Почта</label><input id="email" required type="email" placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="password" required type="password" minlength="6" placeholder="Минимум 6 символов"></div>${reg?'<div class="field"><label>Юзернейм</label><input id="username" required maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="burmal_user"></div>':''}<button class="primary" type="submit">${reg?'Зарегистрироваться':'Войти'}</button></form><div class="switch">${reg?'Уже есть аккаунт?':'Нет аккаунта?'} <span class="link" id="switchAuth">${reg?'Войти':'Создать аккаунт'}</span></div><div class="hint">Пароль обрабатывается Firebase Authentication. Фотографии и загрузка файлов в этой версии отключены.</div></div>`;$('#googleBtn').onclick=async()=>{try{await signInWithPopup(auth,google)}catch(e){toast(authErr(e),true)}};$('#switchAuth').onclick=()=>authView(reg?'login':'register');$('#authForm').onsubmit=async e=>{e.preventDefault();try{if(reg){const name=$('#name').value.trim(),u=$('#username').value.trim().toLowerCase(),email=$('#email').value.trim(),pw=$('#password').value;if(!/^[a-z0-9_]{3,24}$/.test(u))throw{code:'custom/username'};const q=getDocs(query(collection(db,'users'),where('usernameLower','==',u),limit(1)));if(!(await q).empty)throw{code:'custom/taken'};const c=await createUserWithEmailAndPassword(auth,email,pw);await updateProfile(c.user,{displayName:name});await setDoc(doc(db,'users',c.user.uid),userDoc(c.user,{displayName:name,username:u,email}));}else await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value)}catch(e){if(e.code==='custom/username')return toast('Юзернейм: 3–24 символа, латиница, цифры и _.',true);if(e.code==='custom/taken')return toast('Этот юзернейм уже занят.',true);toast(authErr(e),true)}}}
function userDoc(user,extra={}){const n=extra.displayName||user.displayName||'Пользователь';const u=(extra.username||user.email?.split('@')[0]||'user').replace(/[^a-zA-Z0-9_]/g,'_').slice(0,24).toLowerCase();return{displayName:n,displayNameLower:n.toLowerCase(),username:u,usernameLower:u,email:extra.email||user.email||'',bio:'',createdAt:serverTimestamp(),privacy:{lastSeen:'contacts',profilePhoto:'everyone',forwarding:'nobody',readReceipts:true},blocked:[],...extra}}

onAuthStateChanged(auth,async user=>{try{if(state.chatsUnsub)state.chatsUnsub();if(state.msgUnsub)state.msgUnsub();state.user=user;state.profile=null;state.activeChat=null;state.chats=[];state.users.clear();if(!user){$('#app').classList.add('hidden');$('#auth').classList.remove('hidden');authView('login');return}$('#auth').classList.add('hidden');$('#app').classList.remove('hidden');const uref=doc(db,'users',user.uid),snap=await getDoc(uref);if(!snap.exists())await setDoc(uref,userDoc(user));const fresh=await getDoc(uref);state.profile={id:user.uid,...fresh.data()};state.blocked=new Set(state.profile.blocked||[]);renderMe();subscribeChats()}catch(e){console.error(e);toast(authErr(e),true)}});

function renderMe(){$('#meAvatar').outerHTML=av(state.profile.displayName,'avatar mini');$('#meAvatar').id='meAvatar';$('#meName').textContent=state.profile.displayName||'Пользователь';$('#meUser').textContent='@'+(state.profile.username||'user')}
async function preload(rows){for(const c of rows){for(const uid of c.members||[]){if(uid===state.user.uid||state.users.has(uid))continue;try{const s=await getDoc(doc(db,'users',uid));if(s.exists())state.users.set(uid,{id:uid,...s.data()})}catch{}}}}
function title(c){if(c.type!=='dm')return c.name||'Без названия';const uid=(c.members||[]).find(x=>x!==state.user.uid);const p=state.users.get(uid);return p?.displayName||p?.username||'Личный чат'}
function subtitle(c){if(c.type==='channel')return 'канал';if(c.type==='group')return `${c.members?.length||1} участника`;const uid=(c.members||[]).find(x=>x!==state.user.uid);const p=state.users.get(uid);return p?('@'+p.username):'личный чат'}
function avatarName(c){return title(c)}
function renderChats(){const q=state.search.trim().toLowerCase();let list=state.chats.filter(c=>state.filter==='all'||c.type===state.filter).filter(c=>!q||title(c).toLowerCase().includes(q)||(c.username||'').toLowerCase().includes(q));if(!list.length){$('#chatList').innerHTML='<div style="padding:25px;color:var(--muted);text-align:center;font-size:13px">Ничего не найдено</div>';return}$('#chatList').innerHTML=list.map(c=>`<div class="chatitem ${state.activeChat?.id===c.id?'active':''}" data-id="${c.id}">${av(avatarName(c))}<div class="chatmeta"><div class="chatline"><div class="chatname">${esc(title(c))}</div><div class="chatdate">${esc(time(c.updatedAt))}</div></div><div class="preview">${c.type==='channel'?'📢 ':c.type==='group'?'👥 ':''}${esc(c.lastMessage?.text||'Новый чат')}</div></div>${c.unreadCount?.[state.user.uid]?`<div class="unread">${c.unreadCount[state.user.uid]}</div>`:''}</div>`).join('');$$('#chatList .chatitem').forEach(e=>e.onclick=()=>openChat(e.dataset.id))}
function subscribeChats(){state.chatsUnsub=onSnapshot(query(collection(db,'chats'),where('members','array-contains',state.user.uid)),async snap=>{const rows=[];snap.forEach(d=>{const c={id:d.id,...d.data()};if(c.type==='dm'&&(c.members||[]).some(id=>state.blocked.has(id)))return;rows.push(c)});rows.sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0));state.chats=rows;await preload(rows);renderChats();if(state.activeChat){const same=rows.find(x=>x.id===state.activeChat.id);if(same){state.activeChat=same;renderHeader()}}},e=>toast(authErr(e),true))}
async function openChat(id){const c=state.chats.find(x=>x.id===id);if(!c)return;state.activeChat=c;document.body.querySelector('#app').classList.add('chatopen');renderHeader();listenMessages();}
function renderHeader(){const c=state.activeChat;if(!c){$('#topName').textContent='Выберите чат';$('#topStatus').textContent='';$('#topAvatar').textContent='B';return}$('#topAvatar').outerHTML=av(avatarName(c),'avatar topavatar');$('#topAvatar').id='topAvatar';$('#topName').textContent=title(c);$('#topStatus').textContent=subtitle(c);const canWrite=c.type!=='channel'||(c.admins||[]).includes(state.user.uid);$('#messageInput').disabled=!canWrite;$('#sendBtn').disabled=!canWrite;renderChats()}
function listenMessages(){if(state.msgUnsub)state.msgUnsub();if(!state.activeChat)return;$('#messages').innerHTML='<div class="system">Загрузка истории…</div>';state.msgUnsub=onSnapshot(query(collection(db,'chats',state.activeChat.id,'messages'),orderBy('createdAt','asc'),limit(500)),snap=>{const box=$('#messages');box.innerHTML='<div class="system">Начало истории</div>';snap.forEach(d=>{const m=d.data(),me=m.senderId===state.user.uid;const row=document.createElement('div');row.className='msgrow '+(me?'me':'');row.innerHTML=`${me?'':av(m.senderName||'Пользователь','avatar msgavatar')}<div class="bubble"><div class="msgtext">${esc(m.text)}</div><div class="msgsub"><span title="${esc(longTime(m.createdAt))}">${esc(time(m.createdAt))}</span>${me?'<span>✓✓</span>':''}</div></div>`;box.append(row)});box.scrollTop=box.scrollHeight},e=>toast(authErr(e),true))}
async function sendMessage(){const text=$('#messageInput').value.trim();if(!text||!state.activeChat)return;const c=state.activeChat;if(c.type==='channel'&&!(c.admins||[]).includes(state.user.uid))return toast('В канале писать могут только администраторы.',true);$('#messageInput').value='';$('#messageInput').style.height='auto';$('#sendBtn').disabled=true;try{const payload={text,senderId:state.user.uid,senderName:state.profile.displayName||'Пользователь',createdAt:serverTimestamp()};await addDoc(collection(db,'chats',c.id,'messages'),payload);const unread={...(c.unreadCount||{})};for(const uid of c.members||[])if(uid!==state.user.uid)unread[uid]=(unread[uid]||0)+1;await updateDoc(doc(db,'chats',c.id),{lastMessage:{text:text.slice(0,140),senderId:state.user.uid},updatedAt:serverTimestamp(),unreadCount:unread})}catch(e){toast(authErr(e),true)}finally{$('#sendBtn').disabled=$('#messageInput').disabled}}

async function lookupUsers(inputId='userLookup',resultsId='lookupResults',multi=false){const raw=$(inputId)?.value.trim().replace(/^@/,'').toLowerCase();if(!raw)return;try{const qs=[query(collection(db,'users'),where('usernameLower','==',raw),limit(10)),query(collection(db,'users'),where('email','==',raw),limit(10))];const map=new Map();for(const q of qs)(await getDocs(q)).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));const arr=[...map.values()].filter(p=>p.id!==state.user.uid&&!state.blocked.has(p.id));$(resultsId).innerHTML=arr.length?arr.map(p=>`<div class="result ${multi&&state.selectedMembers.has(p.id)?'selected':''}" data-user="${p.id}">${av(p.displayName,'avatar msgavatar')}<div class="grow"><b>${esc(p.displayName)}</b><div class="small">@${esc(p.username)}</div></div>${multi?'<div class="check">'+(state.selectedMembers.has(p.id)?'✓':'')+'</div>':'<button class="secondary">Открыть</button>'}</div>`).join(''):'<div style="padding:10px;color:var(--muted)">Пользователь не найден.</div>';$$('#'+resultsId+' [data-user]').forEach(el=>el.onclick=()=>multi?toggleMember(el.dataset.user,el):startDm(el.dataset.user))}catch(e){toast(authErr(e),true)}}
function toggleMember(uid,el){if(state.selectedMembers.has(uid))state.selectedMembers.delete(uid);else{const p=state.users.get(uid);if(p)state.selectedMembers.set(uid,p);else getDoc(doc(db,'users',uid)).then(s=>{if(s.exists())state.users.set(uid,{id:uid,...s.data()});renderGroupResults()})}renderGroupResults()}
function renderGroupResults(){const input=$('#userLookup');if(input)lookupUsers('userLookup','lookupResults',true)}
async function startDm(uid){try{const mine=await getDocs(query(collection(db,'chats'),where('members','array-contains',state.user.uid)));const found=mine.docs.find(d=>d.data().type==='dm'&&(d.data().members||[]).length===2&&d.data().members.includes(uid));let id;if(found)id=found.id;else{const p=state.users.get(uid)||(await getDoc(doc(db,'users',uid))).data();const chat=await addDoc(collection(db,'chats'),{type:'dm',members:[state.user.uid,uid].sort(),ownerId:state.user.uid,admins:[state.user.uid],createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:{text:'Чат создан',senderId:state.user.uid},unreadCount:{[state.user.uid]:0,[uid]:0}});state.users.set(uid,{id:uid,...p});id=chat.id}closeModal();setTimeout(()=>openChat(id),200)}catch(e){toast(authErr(e),true)}}
function newChat(){state.selectedMembers.clear();modal('Новый чат',`<div class="row"><button class="primary grow" id="startDm">👤 Личный чат</button><button class="secondary grow" id="newGroup">👥 Группа</button><button class="secondary grow" id="newChannel">📢 Канал</button></div><div class="divider"></div><div class="field"><label>Найти пользователя</label><input id="userLookup" placeholder="@username или email"><div id="lookupResults"></div></div>`, '');$('#startDm').onclick=()=>lookupUsers();$('#newGroup').onclick=()=>communityModal('group');$('#newChannel').onclick=()=>communityModal('channel');$('#userLookup').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();lookupUsers()}}}
function communityModal(type){state.selectedMembers.clear();modal(type==='group'?'Создать группу':'Создать канал',`<div class="formgrid"><div class="field"><label>Название</label><input id="commName" maxlength="60" placeholder="${type==='group'?'Например, Команда Burmalgram':'Например, Новости Burmalgram'}"></div><div class="field"><label>Описание</label><textarea id="commDesc" maxlength="500" placeholder="О чём это место?"></textarea></div><div class="divider"></div>${type==='group'?'<div class="section-title">Добавить участников</div><div class="field"><input id="memberSearch" placeholder="@username или email"></div><div id="memberResults"></div><div id="selectedCount" style="font-size:12px;color:var(--muted)">Выбрано: 0</div>':'<div class="setting"><div><b>Права канала</b><span>По умолчанию писать может владелец.</span></div><b>Владелец</b></div>'}</div>`,`<button class="secondary" id="cancelCommunity">Отмена</button><button class="primary" id="saveCommunity">Создать</button>`);$('#cancelCommunity').onclick=closeModal;if(type==='group'){$('#memberSearch').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();searchMembers()}};$('#saveCommunity').onclick=()=>saveCommunity('group')}else $('#saveCommunity').onclick=()=>saveCommunity('channel')}
async function searchMembers(){const q=$('#memberSearch').value.trim().replace(/^@/,'').toLowerCase();if(!q)return;try{const qs=[query(collection(db,'users'),where('usernameLower','==',q),limit(10)),query(collection(db,'users'),where('email','==',q),limit(10))];const map=new Map();for(const x of qs)(await getDocs(x)).forEach(d=>map.set(d.id,{id:d.id,...d.data()}));const arr=[...map.values()].filter(p=>p.id!==state.user.uid&&!state.blocked.has(p.id));$('#memberResults').innerHTML=arr.length?arr.map(p=>`<div class="result ${state.selectedMembers.has(p.id)?'selected':''}" data-user="${p.id}">${av(p.displayName,'avatar msgavatar')}<div class="grow"><b>${esc(p.displayName)}</b><div class="small">@${esc(p.username)}</div></div><div class="check">${state.selectedMembers.has(p.id)?'✓':''}</div></div>`).join(''):'<div style="padding:8px;color:var(--muted)">Пользователь не найден.</div>';$$('#memberResults [data-user]').forEach(el=>el.onclick=()=>{const uid=el.dataset.user;if(state.selectedMembers.has(uid))state.selectedMembers.delete(uid);else state.selectedMembers.set(uid,true);const current=Number($('#selectedCount').textContent.match(/\d+/)?.[0]||0);$('#selectedCount').textContent='Выбрано: '+(state.selectedMembers.size);searchMembers()})}catch(e){toast(authErr(e),true)}}
async function saveCommunity(type){const name=$('#commName').value.trim();if(name.length<2)return toast('Введите название.',true);const members=[state.user.uid,...state.selectedMembers.keys()];try{const ref=await addDoc(collection(db,'chats'),{type,members,admins:[state.user.uid],ownerId:state.user.uid,name,description:$('#commDesc').value.trim(),createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:{text:type==='group'?'Группа создана':'Канал создан',senderId:state.user.uid},unreadCount:Object.fromEntries(members.map(uid=>[uid,0]))});closeModal();toast(type==='group'?'Группа создана':'Канал создан');setTimeout(()=>openChat(ref.id),300)}catch(e){toast(authErr(e),true)}}

function profileModal(){const p=state.profile;modal('Мой профиль',`<div class="profilehero">${av(p.displayName,'avatar bigavatar')}<div><b>${esc(p.displayName)}</b><div style="color:var(--muted);margin-top:3px">@${esc(p.username)}</div></div></div><div class="field"><label>Имя</label><input id="pName" maxlength="40" value="${esc(p.displayName||'')}"></div><div class="field" style="margin-top:12px"><label>Юзернейм</label><input id="pUsername" maxlength="24" value="${esc(p.username||'')}"></div><div class="field" style="margin-top:12px"><label>О себе</label><textarea id="pBio" maxlength="160">${esc(p.bio||'')}</textarea></div><div style="margin-top:10px;font-size:11px;color:var(--muted)">Фото профиля и загрузка файлов отключены до подключения Firebase Storage.</div>`,`<button class="secondary" id="profileCancel">Отмена</button><button class="primary" id="profileSave">Сохранить</button>`);$('#profileCancel').onclick=closeModal;$('#profileSave').onclick=saveProfile}
async function saveProfile(){const name=$('#pName').value.trim()||'Пользователь',u=$('#pUsername').value.trim().toLowerCase(),bio=$('#pBio').value.trim();if(!/^[a-z0-9_]{3,24}$/.test(u))return toast('Юзернейм: 3–24 символа, латиница, цифры и _.',true);try{const q=await getDocs(query(collection(db,'users'),where('usernameLower','==',u),limit(5)));if(q.docs.some(d=>d.id!==state.user.uid))return toast('Этот юзернейм уже занят.',true);await updateProfile(state.user,{displayName:name});await updateDoc(doc(db,'users',state.user.uid),{displayName:name,displayNameLower:name.toLowerCase(),username:u,usernameLower:u,bio});state.profile={...state.profile,displayName:name,username:u,bio};renderMe();closeModal();toast('Профиль сохранён')}catch(e){toast(authErr(e),true)}}

function settings(){modal('Настройки',`<div class="section-title">Аккаунт</div><div class="setting"><div><b>Мой профиль</b><span>${esc(state.profile.displayName)} · @${esc(state.profile.username)}</span></div><button class="secondary" id="openProfile">Изменить</button></div><div class="setting"><div><b>Конфиденциальность</b><span>Последний визит, прочитано, пересылка</span></div><button class="secondary" id="openPrivacy">Открыть</button></div><div class="setting"><div><b>Заблокированные</b><span>${state.blocked.size} пользователей</span></div><button class="secondary" id="openBlocked">Открыть</button></div><div class="divider"></div><div class="section-title">Приложение</div><div class="setting"><div><b>Темная тема</b><span>Светлая тема доступна тоже</span></div><button class="toggle ${!document.documentElement.classList.contains('light')?'on':''}" id="themeToggle"></button></div><div class="setting"><div><b>Анимации</b><span>Плавные появления и переходы</span></div><button class="toggle ${localStorage.getItem('bg_anim')!=='0'?'on':''}" id="animToggle"></button></div><div class="setting"><div><b>Уведомления</b><span>Настройки этого устройства</span></div><button class="secondary" id="openNotify">Открыть</button></div><div class="divider"></div><div class="setting"><div><b>Выйти</b><span>Завершить текущий сеанс</span></div><button class="danger" id="logoutBtn">Выйти</button></div>`);$('#openProfile').onclick=profileModal;$('#openPrivacy').onclick=privacyModal;$('#openBlocked').onclick=blockedModal;$('#openNotify').onclick=notificationModal;$('#themeToggle').onclick=e=>{document.documentElement.classList.toggle('light');e.currentTarget.classList.toggle('on');localStorage.setItem('bg_theme',document.documentElement.classList.contains('light')?'light':'dark')};$('#animToggle').onclick=e=>{e.currentTarget.classList.toggle('on');localStorage.setItem('bg_anim',e.currentTarget.classList.contains('on')?'1':'0');document.documentElement.style.setProperty('--shadow',e.currentTarget.classList.contains('on')?'0 24px 80px rgba(0,0,0,.42)':'none')};$('#logoutBtn').onclick=()=>signOut(auth)}
function privacyModal(){const p=state.profile.privacy||{};modal('Конфиденциальность',`<div class="setting"><div><b>Последний визит</b><span>Кто видит вашу активность</span></div><select id="lastSeen"><option value="everyone">Все</option><option value="contacts">Контакты</option><option value="nobody">Никто</option></select></div><div class="setting"><div><b>Прочитанные сообщения</b><span>Показывать статус прочтения</span></div><button class="toggle ${p.readReceipts!==false?'on':''}" id="readToggle"></button></div><div class="setting"><div><b>Пересылка сообщений</b><span>Кто может использовать ваши сообщения</span></div><select id="forwarding"><option value="everyone">Все</option><option value="contacts">Контакты</option><option value="nobody">Никто</option></select></div>`,`<button class="primary" id="savePrivacy">Сохранить</button>`);$('#lastSeen').value=p.lastSeen||'contacts';$('#forwarding').value=p.forwarding||'nobody';$('#readToggle').onclick=e=>e.currentTarget.classList.toggle('on');$('#savePrivacy').onclick=async()=>{const privacy={lastSeen:$('#lastSeen').value,forwarding:$('#forwarding').value,readReceipts:$('#readToggle').classList.contains('on'),profilePhoto:'everyone'};try{await updateDoc(doc(db,'users',state.user.uid),{privacy});state.profile.privacy=privacy;closeModal();toast('Конфиденциальность сохранена')}catch(e){toast(authErr(e),true)}}}
function notificationModal(){const c=JSON.parse(localStorage.getItem('bg_notify')||'{"messages":true,"groups":true,"sounds":true}');modal('Уведомления',`<div class="setting"><div><b>Личные сообщения</b><span>Уведомлять о новых личных чатах</span></div><button class="toggle ${c.messages?'on':''}" data-n="messages"></button></div><div class="setting"><div><b>Группы</b><span>Уведомлять о новых сообщениях в группах</span></div><button class="toggle ${c.groups?'on':''}" data-n="groups"></button></div><div class="setting"><div><b>Звуки интерфейса</b><span>Локальный переключатель</span></div><button class="toggle ${c.sounds?'on':''}" data-n="sounds"></button></div>`,`<button class="primary" id="saveNotify">Сохранить</button>`);$$('[data-n]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));$('#saveNotify').onclick=()=>{const n={};$$('[data-n]').forEach(b=>n[b.dataset.n]=b.classList.contains('on'));localStorage.setItem('bg_notify',JSON.stringify(n));closeModal();toast('Уведомления сохранены')}}
async function blockedModal(){const people=[];for(const uid of state.blocked){const s=await getDoc(doc(db,'users',uid));if(s.exists())people.push({id:uid,...s.data()})}modal('Заблокированные',people.length?people.map(p=>`<div class="result">${av(p.displayName,'avatar msgavatar')}<div class="grow"><b>${esc(p.displayName)}</b><div class="small">@${esc(p.username)}</div></div><button class="secondary" data-unblock="${p.id}">Разблокировать</button></div>`).join(''):'<div style="color:var(--muted)">Список пуст.</div>');$$('[data-unblock]').forEach(b=>b.onclick=async()=>{const uid=b.dataset.unblock;try{await updateDoc(doc(db,'users',state.user.uid),{blocked:[...state.blocked].filter(x=>x!==uid)});state.blocked.delete(uid);closeModal();subscribeChats();toast('Пользователь разблокирован')}catch(e){toast(authErr(e),true)}})}
async function chatInfo(){const c=state.activeChat;if(!c)return; if(c.type==='dm'){const uid=(c.members||[]).find(x=>x!==state.user.uid),p=state.users.get(uid);modal(title(c),`<div class="profilehero">${av(p?.displayName||'Пользователь','avatar bigavatar')}<div><b>${esc(p?.displayName||'Пользователь')}</b><div style="color:var(--muted);margin-top:3px">@${esc(p?.username||'user')}</div><div style="color:var(--muted);margin-top:7px">${esc(p?.bio||'Без описания')}</div></div></div><div class="divider"></div><button class="danger" id="blockBtn">Заблокировать пользователя</button>`);$('#blockBtn').onclick=()=>blockUser(uid)}else modal(c.name||'Сообщество',`<div style="color:var(--muted);line-height:1.5">${esc(c.description||'Без описания')}</div><div class="divider"></div><div class="setting"><div><b>Участники</b><span>${c.members?.length||1}</span></div></div><div class="setting"><div><b>Тип</b><span>${c.type==='channel'?'Канал':'Группа'}</span></div></div>`)}
async function blockUser(uid){try{const blocked=[...state.blocked,uid];await updateDoc(doc(db,'users',state.user.uid),{blocked});state.blocked.add(uid);closeModal();state.activeChat=null;if(state.msgUnsub)state.msgUnsub();renderHeader();subscribeChats();toast('Пользователь заблокирован')}catch(e){toast(authErr(e),true)}}

$('#newChatBtn').onclick=newChat;$('#settingsBtn').onclick=settings;$('#profileBar').onclick=e=>{if(!e.target.closest('#settingsBtn'))profileModal()};$('#chatInfoBtn').onclick=chatInfo;$('#backBtn').onclick=()=>$('#app').classList.remove('chatopen');$('#searchInput').oninput=e=>{state.search=e.target.value;renderChats()};$$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderChats()});$('#messageInput').oninput=e=>{const v=e.target.value.trim();$('#sendBtn').disabled=!v||e.target.disabled;e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,130)+'px'};$('#messageInput').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}};$('#sendBtn').onclick=sendMessage;$('#searchChatBtn').onclick=()=>toast('Поиск по сообщениям будет подключён отдельно.')
const savedTheme=localStorage.getItem('bg_theme');if(savedTheme==='light')document.documentElement.classList.add('light');
</script>
