<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#111318" />
  <meta name="description" content="Burmalgram — современный мессенджер на Firebase." />
  <title>Burmalgram</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%236d5dfc'/%3E%3Cpath d='M26 30c0-5 4-9 9-9h31c5 0 9 4 9 9v29c0 5-4 9-9 9H53l-14 11V68H35c-5 0-9-4-9-9V30Z' fill='white'/%3E%3Cpath d='M38 38h24M38 48h16' stroke='%236d5dfc' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E" />
  <link rel="manifest" href="manifest.webmanifest" />
  <style>
    :root{--bg:#0b0d11;--panel:#11141b;--panel2:#171b23;--border:#272d38;--text:#f4f6fb;--muted:#9299aa;--accent:#6d5dfc;--accent2:#8c7cff;--danger:#ef5b68;--green:#46d39a;--bubble:#1a202b;--bubbleMe:#5145cc;--shadow:0 20px 60px rgba(0,0,0,.35)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(1200px 700px at 10% 0,#19133a 0%,transparent 55%),var(--bg);color:var(--text);overflow:hidden}
    button,input,textarea,select{font:inherit}button{border:0;cursor:pointer;color:inherit}.hidden{display:none!important}
    .app{height:100vh;display:grid;grid-template-columns:340px minmax(0,1fr);position:relative}
    .sidebar{background:rgba(17,20,27,.86);backdrop-filter:blur(18px);border-right:1px solid var(--border);display:flex;flex-direction:column;min-width:0}
    .brandbar{height:76px;display:flex;align-items:center;gap:12px;padding:0 18px;border-bottom:1px solid var(--border)}
    .logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--accent),#9c72ff);display:grid;place-items:center;box-shadow:0 10px 28px rgba(109,93,252,.3);flex:none}.logo svg{width:23px}
    .brand{font-weight:800;letter-spacing:.2px}.brand small{display:block;color:var(--muted);font-weight:500;margin-top:1px}
    .iconbtn{width:38px;height:38px;border-radius:12px;background:transparent;display:grid;place-items:center;color:var(--muted);transition:.2s}.iconbtn:hover{background:var(--panel2);color:var(--text)}
    .brandbar .iconbtn{margin-left:auto}.search{padding:13px 14px}.searchbox{height:43px;border:1px solid var(--border);background:#0d1016;border-radius:13px;display:flex;align-items:center;padding:0 12px;gap:9px}.searchbox svg{color:var(--muted);width:17px}.searchbox input{border:0;outline:0;background:transparent;color:var(--text);min-width:0;width:100%}.searchbox input::placeholder{color:#697183}
    .filters{display:flex;gap:7px;padding:0 14px 12px}.chip{background:#141821;border:1px solid var(--border);color:var(--muted);padding:7px 11px;border-radius:999px;font-size:12px}.chip.active{background:rgba(109,93,252,.16);border-color:rgba(109,93,252,.45);color:#ddd8ff}
    .chatlist{overflow:auto;padding:4px 8px 12px}.chatitem{display:flex;gap:12px;padding:11px 10px;border-radius:14px;align-items:center;transition:.18s;cursor:pointer}.chatitem:hover{background:#151922}.chatitem.active{background:linear-gradient(135deg,rgba(109,93,252,.2),rgba(109,93,252,.08));outline:1px solid rgba(109,93,252,.17)}
    .avatar{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#292f3b,#1d2230);display:grid;place-items:center;font-weight:800;overflow:hidden;flex:none}.avatar img{width:100%;height:100%;object-fit:cover}.chatmeta{min-width:0;flex:1}.chatline{display:flex;gap:8px;align-items:center}.chatname{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chatdate{margin-left:auto;color:#687081;font-size:11px}.chatpreview{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}.unread{min-width:21px;height:21px;border-radius:999px;background:var(--accent);display:grid;place-items:center;font-size:11px;font-weight:800}
    .profilebar{margin-top:auto;border-top:1px solid var(--border);padding:12px;display:flex;align-items:center;gap:10px}.meavatar{width:38px;height:38px;border-radius:12px}.profilebar .name{font-weight:700;font-size:14px}.profilebar .status{font-size:12px;color:var(--green)}.profilebar .iconbtn{margin-left:auto}
    .main{min-width:0;display:flex;flex-direction:column;background:linear-gradient(rgba(10,12,17,.55),rgba(10,12,17,.65)),radial-gradient(900px 600px at 80% 20%,rgba(109,93,252,.08),transparent 55%)}
    .topbar{height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 20px;background:rgba(11,13,17,.55);backdrop-filter:blur(14px)}.topbar .back{display:none}.topavatar{width:42px;height:42px;border-radius:13px}.topmeta{min-width:0}.topname{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topstatus{color:var(--muted);font-size:12px;margin-top:2px}.topactions{margin-left:auto;display:flex;gap:6px}
    .messages{flex:1;overflow:auto;padding:28px clamp(18px,6vw,90px);display:flex;flex-direction:column;gap:8px}.empty{margin:auto;text-align:center;color:var(--muted)}.empty h2{color:var(--text);margin-bottom:8px}.msgrow{display:flex;align-items:flex-end;gap:8px;max-width:76%;animation:rise .22s ease}.msgrow.me{margin-left:auto;flex-direction:row-reverse}.bubble{background:var(--bubble);border:1px solid #252b37;padding:10px 12px;border-radius:17px 17px 17px 5px;box-shadow:0 7px 24px rgba(0,0,0,.12)}.me .bubble{background:linear-gradient(135deg,var(--bubbleMe),#655ae9);border-color:rgba(255,255,255,.08);border-radius:17px 17px 5px 17px}.msgtext{white-space:pre-wrap;word-break:break-word;line-height:1.45}.msgsub{display:flex;align-items:center;gap:8px;justify-content:flex-end;color:#9ea5b3;font-size:10px;margin-top:5px}.me .msgsub{color:#ddd9ff}.replyname{color:#c5c9ff;font-size:11px;margin-bottom:4px;font-weight:700}.composer{padding:12px clamp(18px,6vw,90px) 18px;border-top:1px solid rgba(39,45,56,.6);background:rgba(11,13,17,.55);backdrop-filter:blur(14px)}.composebox{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--border);background:#10141b;border-radius:16px;padding:7px}.composebox textarea{flex:1;resize:none;max-height:130px;min-height:43px;padding:10px 8px;background:transparent;border:0;outline:0;color:var(--text);line-height:1.4}.send{width:43px;height:43px;border-radius:13px;background:var(--accent);display:grid;place-items:center;box-shadow:0 8px 22px rgba(109,93,252,.25)}.send:disabled{opacity:.4;box-shadow:none}
    .modalwrap{position:fixed;inset:0;background:rgba(3,4,7,.68);backdrop-filter:blur(10px);display:grid;place-items:center;padding:20px;z-index:20}.modal{width:min(560px,100%);background:#11151d;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;animation:pop .2s ease}.modalhead{padding:19px 21px;display:flex;align-items:center;border-bottom:1px solid var(--border)}.modalhead h3{margin:0}.modalbody{padding:20px;max-height:75vh;overflow:auto}.formgrid{display:grid;gap:12px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 6px 2px}.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);background:#0c1016;color:var(--text);outline:0;border-radius:13px;padding:12px 13px}.field textarea{min-height:100px;resize:vertical}.row{display:flex;gap:10px}.grow{flex:1}.primary{background:var(--accent);padding:11px 15px;border-radius:12px;font-weight:700}.secondary{background:#1a1f29;border:1px solid var(--border);padding:11px 15px;border-radius:12px}.danger{background:rgba(239,91,104,.12);color:#ff9aa4;border:1px solid rgba(239,91,104,.25);padding:11px 15px;border-radius:12px}.divider{height:1px;background:var(--border);margin:18px 0}.setting{display:flex;justify-content:space-between;align-items:center;gap:18px;padding:13px 0;border-bottom:1px solid #20252f}.setting:last-child{border-bottom:0}.setting b{display:block}.setting span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.toggle{width:44px;height:25px;border-radius:99px;background:#2a303b;padding:3px;transition:.2s}.toggle:before{content:"";display:block;width:19px;height:19px;border-radius:50%;background:#9aa2b2;transition:.2s}.toggle.on{background:var(--accent)}.toggle.on:before{transform:translateX(19px);background:white}
    .auth{position:fixed;inset:0;display:grid;place-items:center;padding:20px;background:radial-gradient(900px 550px at 20% 15%,rgba(109,93,252,.25),transparent 50%),#090b10}.authcard{width:min(480px,100%);background:rgba(17,21,29,.9);border:1px solid var(--border);border-radius:27px;padding:34px;box-shadow:var(--shadow);backdrop-filter:blur(18px);animation:pop .3s ease}.authlogo{width:58px;height:58px;margin-bottom:16px}.auth h1{margin:0;font-size:30px}.auth p{color:var(--muted);margin:8px 0 24px}.auth .social{height:48px;width:100%;border:1px solid var(--border);background:#151a22;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:9px;font-weight:700}.or{display:flex;gap:10px;align-items:center;color:#596171;font-size:11px;margin:16px 0}.or:before,.or:after{content:"";height:1px;background:var(--border);flex:1}.auth .primary{width:100%;height:48px;margin-top:6px}.authswitch{text-align:center;margin-top:18px;color:var(--muted);font-size:13px}.link{color:#bcb5ff;cursor:pointer}.hint{font-size:11px;color:#6f7788;margin-top:12px;line-height:1.5}
    .toast{position:fixed;right:18px;bottom:18px;z-index:50;background:#191e27;border:1px solid var(--border);box-shadow:var(--shadow);padding:12px 14px;border-radius:13px;max-width:360px;animation:rise .2s ease}.toast.error{border-color:rgba(239,91,104,.35)}
    .typing{color:var(--muted);font-size:11px;margin:0 0 5px 56px;min-height:14px}.system{align-self:center;color:#667080;font-size:11px;background:#10141b;padding:6px 10px;border-radius:999px}
    @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
    @media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:absolute;inset:0 0 0 0;width:100%;z-index:5;transform:translateX(0);transition:.25s}.app.chatopen .sidebar{transform:translateX(-100%)}.topbar .back{display:grid}.messages{padding:20px 12px}.composer{padding:10px 12px 14px}.msgrow{max-width:88%}}
    @media(max-width:520px){.authcard{padding:24px}.topbar{padding:0 12px}.topactions .hide-mobile{display:none!important}.brandbar{height:68px}.search{padding-top:10px}.modalwrap{padding:8px}.modal{border-radius:19px}}
  </style>
</head>
<body>
  <div id="auth" class="auth hidden"></div>
  <div id="app" class="app hidden">
    <aside class="sidebar">
      <div class="brandbar"><div class="logo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6.5C5 5.12 6.12 4 7.5 4h9C17.88 4 19 5.12 19 6.5v8c0 1.38-1.12 2.5-2.5 2.5H13l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 14.5v-8Z" fill="white"/><path d="M9 9h6M9 12h4" stroke="#6d5dfc" stroke-width="1.7" stroke-linecap="round"/></svg></div><div class="brand">Burmalgram<small>Связь без лишнего</small></div><button class="iconbtn" id="newChatBtn" title="Новый чат">＋</button></div>
      <div class="search"><div class="searchbox"><svg viewBox="0 0 24 24" fill="none"><circle cx="10.8" cy="10.8" r="6.8" stroke="currentColor" stroke-width="1.8"/><path d="m16 16 5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="searchInput" placeholder="Поиск чатов и пользователей" /></div></div>
      <div class="filters"><button class="chip active" data-filter="all">Все</button><button class="chip" data-filter="groups">Группы</button><button class="chip" data-filter="channels">Каналы</button></div>
      <div id="chatList" class="chatlist"></div>
      <div class="profilebar"><div id="meAvatar" class="avatar meavatar"></div><div class="grow"><div id="meName" class="name">Профиль</div><div id="meStatus" class="status">онлайн</div></div><button class="iconbtn" id="settingsBtn" title="Настройки">⚙</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="iconbtn back" id="backBtn">‹</button><div id="topAvatar" class="avatar topavatar"></div><div class="topmeta"><div id="topName" class="topname">Выберите чат</div><div id="topStatus" class="topstatus">Здесь появятся ваши сообщения</div></div><div class="topactions"><button class="iconbtn hide-mobile" id="searchChatBtn">⌕</button><button class="iconbtn" id="chatInfoBtn">⋯</button></div></header>
      <div id="typing" class="typing"></div>
      <section id="messages" class="messages"><div class="empty"><h2>Добро пожаловать в Burmalgram</h2><div>Создайте чат, группу или канал — и начинайте общаться.</div></div></section>
      <div class="composer"><div class="composebox"><button class="iconbtn" id="attachBtn" title="Вложение">⌕</button><textarea id="messageInput" rows="1" placeholder="Написать сообщение…" disabled></textarea><button class="send" id="sendBtn" disabled>➤</button></div></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>

  <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js';
    import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signInWithPopup, GoogleAuthProvider, updateProfile, signOut, sendPasswordResetEmail } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js';
    import { getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, collection, query, where, orderBy, onSnapshot, serverTimestamp, limit, getDocs, arrayUnion, arrayRemove, deleteDoc } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js';
    import { getStorage, ref, uploadBytes, getDownloadURL } from 'https://www.gstatic.com/firebasejs/12.18.0/firebase-storage.js';

    const firebaseConfig = {
      apiKey: 'AIzaSyAjftpHgU757wxDsVsm3fOprRF2UGfPCJk',
      authDomain: 'burmalgram-91a54.firebaseapp.com',
      projectId: 'burmalgram-91a54',
      storageBucket: 'burmalgram-91a54.firebasestorage.app',
      messagingSenderId: '322071333189',
    };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);
    const google = new GoogleAuthProvider();

    const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
    const state = { user:null, profile:null, chats:[], activeChat:null, messagesUnsub:null, chatsUnsub:null, usersCache:new Map(), filter:'all', search:'', blocked:new Set(), settings:{}, contactsUnsub:null };

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    const initials = n => (String(n||'?').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('')||'?').toUpperCase();
    const formatTime = ts => { if(!ts?.toDate) return ''; const d=ts.toDate(), now=new Date(); return d.toDateString()===now.toDateString()?d.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}):d.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit'}); };
    const formatDateTime = ts => ts?.toDate ? ts.toDate().toLocaleString('ru-RU',{day:'2-digit',month:'long',hour:'2-digit',minute:'2-digit'}) : '';
    function avatarHtml(p, cls='avatar'){ return `<div class="${cls}">${p?.photoURL?`<img src="${esc(p.photoURL)}" alt="">`:esc(initials(p?.displayName||p?.username||'?'))}</div>`; }
    function toast(text, error=false){ const el=document.createElement('div'); el.className='toast'+(error?' error':''); el.textContent=text; $('#toastRoot').append(el); setTimeout(()=>el.remove(),3800); }
    function closeModal(){ $('#modalRoot').innerHTML=''; }
    function modal(title, body, footer=''){ $('#modalRoot').innerHTML=`<div class="modalwrap" id="modalWrap"><div class="modal"><div class="modalhead"><h3>${title}</h3><button class="iconbtn" id="modalClose">×</button></div><div class="modalbody">${body}</div>${footer?`<div style="padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px">${footer}</div>`:''}</div></div>`; $('#modalClose').onclick=closeModal; $('#modalWrap').onclick=e=>{if(e.target.id==='modalWrap')closeModal()}; }
    function authView(mode='login'){ const register=mode==='register'; $('#auth').innerHTML=`<div class="authcard"><div class="logo authlogo"><svg viewBox="0 0 24 24" fill="none"><path d="M5 6.5C5 5.12 6.12 4 7.5 4h9C17.88 4 19 5.12 19 6.5v8c0 1.38-1.12 2.5-2.5 2.5H13l-3.5 3v-3H7.5A2.5 2.5 0 0 1 5 14.5v-8Z" fill="white"/><path d="M9 9h6M9 12h4" stroke="#6d5dfc" stroke-width="1.7" stroke-linecap="round"/></svg></div><h1>${register?'Создать аккаунт':'С возвращением'}</h1><p>${register?'Зарегистрируйтесь в Burmalgram и найдите своих людей.':'Войдите, чтобы продолжить общение.'}</p><button class="social" id="googleBtn"><b style="font-size:19px">G</b> Продолжить с Google</button><div class="or">или</div><form id="authForm" class="formgrid">${register?'<div class="field"><label>Имя</label><input id="name" required minlength="2" maxlength="40" placeholder="Например, Алексей"></div>':''}<div class="field"><label>Почта</label><input id="email" type="email" required placeholder="you@example.com"></div><div class="field"><label>Пароль</label><input id="password" type="password" required minlength="6" placeholder="Минимум 6 символов"></div>${register?'<div class="field"><label>Юзернейм</label><input id="username" required minlength="3" maxlength="24" pattern="[A-Za-z0-9_]+" placeholder="burmalgram_user"></div>':''}<button class="primary" type="submit">${register?'Зарегистрироваться':'Войти'}</button></form><div class="authswitch">${register?'Уже есть аккаунт?':'Нет аккаунта?'} <span class="link" id="authSwitch">${register?'Войти':'Создать аккаунт'}</span></div><div class="hint">Продолжая, вы принимаете правила использования Burmalgram. Пароли обрабатываются Firebase Authentication.</div></div>`;
      $('#googleBtn').onclick=async()=>{try{await signInWithPopup(auth,google)}catch(e){toast(authErr(e),true)}};
      $('#authForm').onsubmit=async e=>{e.preventDefault();try{ if(register){const name=$('#name').value.trim(), username=$('#username').value.trim().toLowerCase(), email=$('#email').value.trim(), password=$('#password').value; const exists=await getDocs(query(collection(db,'users'),where('usernameLower','==',username),limit(1))); if(!exists.empty) throw {code:'custom/username-exists'}; const cred=await createUserWithEmailAndPassword(auth,email,password); await updateProfile(cred.user,{displayName:name}); await setDoc(doc(db,'users',cred.user.uid),{displayName:name,displayNameLower:name.toLowerCase(),username,usernameLower:username,email,photoURL:'',bio:'',createdAt:serverTimestamp(),privacy:{lastSeen:'contacts',profilePhoto:'everyone',forwarding:'nobody',readReceipts:true},blocked:[]});}else{await signInWithEmailAndPassword(auth,$('#email').value.trim(),$('#password').value)}}catch(e){toast(authErr(e),true)}};
      $('#authSwitch').onclick=()=>authView(register?'login':'register'); }
    function authErr(e){ const map={'auth/invalid-credential':'Неверная почта или пароль.','auth/email-already-in-use':'Эта почта уже зарегистрирована.','auth/weak-password':'Пароль слишком простой.','auth/invalid-email':'Некорректная почта.','auth/popup-closed-by-user':'Окно Google было закрыто.','auth/popup-blocked':'Браузер заблокировал окно Google.','custom/username-exists':'Этот юзернейм уже занят.'}; return map[e?.code]||e?.message||'Не удалось выполнить действие.'; }

    onAuthStateChanged(auth, async user=>{
      if(state.chatsUnsub) state.chatsUnsub(); if(state.messagesUnsub) state.messagesUnsub(); state.user=user; state.profile=null; state.activeChat=null; state.chats=[];
      if(!user){ $('#app').classList.add('hidden'); $('#auth').classList.remove('hidden'); authView('login'); return; }
      $('#auth').classList.add('hidden'); $('#app').classList.remove('hidden');
      const refDoc=doc(db,'users',user.uid); const snap=await getDoc(refDoc);
      if(!snap.exists()){ await setDoc(refDoc,{displayName:user.displayName||'Пользователь',displayNameLower:(user.displayName||'Пользователь').toLowerCase(),username:(user.email?.split('@')[0]||'user').replace(/[^a-zA-Z0-9_]/g,'_').slice(0,24),usernameLower:(user.email?.split('@')[0]||'user').replace(/[^a-zA-Z0-9_]/g,'_').slice(0,24).toLowerCase(),email:user.email||'',photoURL:user.photoURL||'',bio:'',createdAt:serverTimestamp(),privacy:{lastSeen:'contacts',profilePhoto:'everyone',forwarding:'nobody',readReceipts:true},blocked:[]}); }
      const fresh=await getDoc(refDoc); state.profile={id:user.uid,...fresh.data()}; state.settings=state.profile.privacy||{}; state.blocked=new Set(state.profile.blocked||[]); renderProfile(); subscribeChats();
    });

    function renderProfile(){ $('#meAvatar').outerHTML=avatarHtml(state.profile,'avatar meavatar'); $('#meAvatar').id='meAvatar'; $('#meName').textContent=state.profile.displayName||state.user.displayName||'Пользователь'; $('#meStatus').textContent='@'+(state.profile.username||'user'); }
    function subscribeChats(){ state.chatsUnsub=onSnapshot(query(collection(db,'chats'),where('members','array-contains',state.user.uid)), async snap=>{const rows=[]; for(const d of snap.docs){const data=d.data(); if((data.type==='dm') && data.members.some(x=>state.blocked.has(x))) continue; rows.push({id:d.id,...data});} rows.sort((a,b)=>(b.updatedAt?.seconds||0)-(a.updatedAt?.seconds||0)); state.chats=rows; await preloadUsers(rows); renderChatList(); if(state.activeChat && state.chats.some(c=>c.id===state.activeChat.id)){ state.activeChat=state.chats.find(c=>c.id===state.activeChat.id); renderHeader(); } }); }
    async function preloadUsers(chats){ for(const c of chats){for(const uid of (c.members||[])){if(uid===state.user.uid||state.usersCache.has(uid))continue; const s=await getDoc(doc(db,'users',uid)); if(s.exists()) state.usersCache.set(uid,{id:uid,...s.data()});}} }
    function chatTitle(c){ if(c.type==='group'||c.type==='channel') return c.name||'Без названия'; const other=(c.members||[]).find(id=>id!==state.user.uid); return state.usersCache.get(other)?.displayName||state.usersCache.get(other)?.username||'Личный чат'; }
    function chatAvatar(c){ if(c.type==='group'||c.type==='channel') return {displayName:c.name}; const other=(c.members||[]).find(id=>id!==state.user.uid); return state.usersCache.get(other)||{displayName:'?'}; }
    function renderChatList(){ const q=state.search.trim().toLowerCase(); let list=state.chats.filter(c=>state.filter==='all'||c.type===state.filter.slice(0,-1)).filter(c=>!q||chatTitle(c).toLowerCase().includes(q)||(c.username||'').includes(q)); if(!list.length){$('#chatList').innerHTML='<div style="padding:24px;color:var(--muted);text-align:center;font-size:13px">Пока здесь пусто.</div>';return;} $('#chatList').innerHTML=list.map(c=>{const last=c.lastMessage?.text||'Новый чат';return `<div class="chatitem ${state.activeChat?.id===c.id?'active':''}" data-id="${c.id}">${avatarHtml(chatAvatar(c))}<div class="chatmeta"><div class="chatline"><div class="chatname">${esc(chatTitle(c))}</div><div class="chatdate">${esc(formatTime(c.updatedAt))}</div></div><div class="chatpreview">${c.type==='channel'?'📢 ':''}${esc(last)}</div></div>${c.unreadCount?.[state.user.uid]?`<div class="unread">${c.unreadCount[state.user.uid]}</div>`:''}</div>`}).join(''); $$('.chatitem').forEach(x=>x.onclick=()=>openChat(x.dataset.id)); }
    async function openChat(id){ const c=state.chats.find(x=>x.id===id); if(!c)return; state.activeChat=c; document.body.querySelector('#app').classList.add('chatopen'); renderHeader(); renderMessages(); }
    function renderHeader(){ if(!state.activeChat){$('#topName').textContent='Выберите чат';$('#topStatus').textContent='';$('#topAvatar').innerHTML='';return;} const c=state.activeChat, av=chatAvatar(c); $('#topAvatar').outerHTML=avatarHtml(av,'avatar topavatar'); $('#topAvatar').id='topAvatar'; $('#topName').textContent=chatTitle(c); if(c.type==='dm'){const other=(c.members||[]).find(id=>id!==state.user.uid), p=state.usersCache.get(other); $('#topStatus').textContent=p?'@'+p.username:'личный чат';} else $('#topStatus').textContent=c.type==='channel'?'канал':'группа'; $('#messageInput').disabled=c.type==='channel' ? !(c.admins||[]).includes(state.user.uid):false; $('#sendBtn').disabled=$('#messageInput').disabled; renderChatList(); }
    function renderMessages(){ if(state.messagesUnsub) state.messagesUnsub(); if(!state.activeChat){$('#messages').innerHTML='<div class="empty"><h2>Добро пожаловать в Burmalgram</h2><div>Создайте чат, группу или канал.</div></div>';return;} $('#messages').innerHTML='<div class="system">Сообщения защищены правилами доступа Firebase</div>'; state.messagesUnsub=onSnapshot(query(collection(db,'chats',state.activeChat.id,'messages'),orderBy('createdAt','asc'),limit(500)),snap=>{ const box=$('#messages'); box.innerHTML='<div class="system">Начало истории</div>'; snap.docs.forEach(d=>{const m=d.data(); const row=document.createElement('div'); row.className='msgrow '+(m.senderId===state.user.uid?'me':''); const sender=state.usersCache.get(m.senderId); row.innerHTML=`${m.senderId===state.user.uid?'':avatarHtml(sender||{displayName:m.senderName})}<div class="bubble">${m.replyTo?`<div class="replyname">↪ ${esc(m.replyTo.senderName||'Сообщение')}</div>`:''}<div class="msgtext">${esc(m.text)}</div><div class="msgsub"><span title="${esc(formatDateTime(m.createdAt))}">${esc(formatTime(m.createdAt))}</span>${m.senderId===state.user.uid?'<span>✓✓</span>':''}</div></div>`; box.append(row); }); box.scrollTop=box.scrollHeight; }); }
    async function sendMessage(){ const text=$('#messageInput').value.trim(); if(!text||!state.activeChat)return; if(state.activeChat.type==='channel'&&!(state.activeChat.admins||[]).includes(state.user.uid))return toast('Только владельцы и администраторы могут писать в канале.',true); $('#messageInput').value=''; $('#sendBtn').disabled=true; try{const msg={text,senderId:state.user.uid,senderName:state.profile.displayName||state.user.displayName||'Пользователь',createdAt:serverTimestamp()}; await addDoc(collection(db,'chats',state.activeChat.id,'messages'),msg); const unread={...(state.activeChat.unreadCount||{})}; for(const uid of state.activeChat.members||[]) if(uid!==state.user.uid) unread[uid]=(unread[uid]||0)+1; await updateDoc(doc(db,'chats',state.activeChat.id),{lastMessage:{text: text.slice(0,140),senderId:state.user.uid,createdAt:serverTimestamp()},updatedAt:serverTimestamp(),unreadCount:unread});}catch(e){toast(e.message,true)}finally{$('#sendBtn').disabled=$('#messageInput').disabled;}}

    async function newChat(){ modal('Новый чат',`<div class="formgrid"><div class="row"><button class="primary grow" id="dmCreate">👤 Личный чат</button><button class="secondary grow" id="groupCreate">👥 Группа</button><button class="secondary grow" id="channelCreate">📢 Канал</button></div><div class="divider"></div><div class="field"><label>Найти пользователя по @username или email</label><input id="userLookup" placeholder="@alex или alex@example.com"></div><button class="secondary" id="lookupBtn">Найти</button><div id="lookupResults"></div></div>`); $('#dmCreate').onclick=()=>lookupFlow(false); $('#groupCreate').onclick=()=>lookupFlow(true,'group'); $('#channelCreate').onclick=()=>lookupFlow(true,'channel'); $('#lookupBtn').onclick=lookupUsers; }
    async function lookupUsers(){const raw=$('#userLookup').value.trim().replace(/^@/,'').toLowerCase(); if(!raw)return; const qs=[query(collection(db,'users'),where('usernameLower','==',raw),limit(10)),query(collection(db,'users'),where('email','==',raw),limit(10))]; const map=new Map(); for(const qx of qs){const s=await getDocs(qx);s.forEach(d=>map.set(d.id,{id:d.id,...d.data()}));} const arr=[...map.values()].filter(x=>x.id!==state.user.uid); $('#lookupResults').innerHTML=arr.length?arr.map(p=>`<button class="chatitem" data-uid="${p.id}" style="width:100%;text-align:left;background:transparent">${avatarHtml(p)}<span><b>${esc(p.displayName)}</b><br><small style="color:var(--muted)">@${esc(p.username)}</small></span></button>`).join(''):'<div style="padding:12px;color:var(--muted)">Пользователь не найден.</div>'; $$('#lookupResults [data-uid]').forEach(x=>x.onclick=()=>startDm(x.dataset.uid)); }
    async function startDm(uid){const ids=[state.user.uid,uid].sort(); const qx=await getDocs(query(collection(db,'chats'),where('members','array-contains',state.user.uid))); let found=qx.docs.find(d=>d.data().type==='dm'&&d.data().members.length===2&&d.data().members.includes(uid)); let id; if(found)id=found.id; else{const other=state.usersCache.get(uid)||(await getDoc(doc(db,'users',uid))).data(); const chat=await addDoc(collection(db,'chats'),{type:'dm',members:ids,createdBy:state.user.uid,createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:{text:'Чат создан',senderId:state.user.uid,createdAt:serverTimestamp()},unreadCount:{[state.user.uid]:0,[uid]:0}}); id=chat.id; state.usersCache.set(uid,{id:uid,...other});} closeModal(); setTimeout(()=>openChat(id),150); }
    function lookupFlow(create, type){ if(type==='group'||type==='channel'){ createCommunity(type); } else lookupUsers(); }
    function createCommunity(type){ modal(type==='group'?'Создать группу':'Создать канал',`<div class="formgrid"><div class="field"><label>Название</label><input id="commName" maxlength="60" placeholder="Например, Команда Burmalgram"></div><div class="field"><label>Описание</label><textarea id="commDesc" maxlength="500" placeholder="О чём это сообщество?"></textarea></div>${type==='channel'?'<div class="setting"><div><b>Тип</b><span>Публичный канал можно найти по username позже.</span></div><span style="font-size:12px;color:var(--green)">Публичный</span></div>':''}</div>`, `<button class="secondary" id="commCancel">Отмена</button><button class="primary" id="commSave">Создать</button>`); $('#commCancel').onclick=closeModal; $('#commSave').onclick=async()=>{const name=$('#commName').value.trim();if(!name)return toast('Введите название.',true); const c=await addDoc(collection(db,'chats'),{type,members:[state.user.uid],admins:[state.user.uid],ownerId:state.user.uid,name,description:$('#commDesc').value.trim(),createdAt:serverTimestamp(),updatedAt:serverTimestamp(),lastMessage:{text:type==='group'?'Группа создана':'Канал создан',senderId:state.user.uid,createdAt:serverTimestamp()},unreadCount:{[state.user.uid]:0}});closeModal();setTimeout(()=>openChat(c.id),250);}; }

    async function settings(){ modal('Настройки',`<div class="formgrid"><div class="setting"><div><b>Профиль</b><span>${esc(state.profile.displayName)} · @${esc(state.profile.username)}</span></div><button class="secondary" id="editProfile">Изменить</button></div><div class="setting"><div><b>Конфиденциальность</b><span>Кто видит профиль, время и прочее</span></div><button class="secondary" id="privacyBtn">Открыть</button></div><div class="setting"><div><b>Уведомления</b><span>Настройки уведомлений сохраняются локально</span></div><button class="secondary" id="notifyBtn">Открыть</button></div><div class="setting"><div><b>Заблокированные</b><span>${state.blocked.size} пользователей</span></div><button class="secondary" id="blockedBtn">Открыть</button></div><div class="divider"></div><div class="setting"><div><b>Выйти из аккаунта</b><span>Сеанс будет завершён на этом устройстве.</span></div><button class="danger" id="logout">Выйти</button></div></div>`); $('#editProfile').onclick=editProfile; $('#privacyBtn').onclick=privacySettings; $('#notifyBtn').onclick=notificationSettings; $('#blockedBtn').onclick=blockedUsers; $('#logout').onclick=()=>signOut(auth); }
    function editProfile(){modal('Профиль',`<div class="formgrid"><div class="field"><label>Имя</label><input id="pName" value="${esc(state.profile.displayName||'')}" maxlength="40"></div><div class="field"><label>Юзернейм</label><input id="pUsername" value="${esc(state.profile.username||'')}" maxlength="24" pattern="[A-Za-z0-9_]+"></div><div class="field"><label>О себе</label><textarea id="pBio" maxlength="160">${esc(state.profile.bio||'')}</textarea></div><div class="field"><label>Аватар</label><input id="pPhoto" type="file" accept="image/*"></div></div>`,`<button class="secondary" id="pCancel">Отмена</button><button class="primary" id="pSave">Сохранить</button>`); $('#pCancel').onclick=closeModal; $('#pSave').onclick=saveProfile; }
    async function saveProfile(){try{const name=$('#pName').value.trim(), username=$('#pUsername').value.trim().toLowerCase(), bio=$('#pBio').value.trim(); if(!/^[a-z0-9_]{3,24}$/.test(username))return toast('Юзернейм: 3–24 символа, только латиница, цифры и _.',true); const exists=await getDocs(query(collection(db,'users'),where('usernameLower','==',username),limit(2))); if(!exists.empty&&exists.docs.some(d=>d.id!==state.user.uid))return toast('Этот юзернейм уже занят.',true); let photoURL=state.profile.photoURL||''; const f=$('#pPhoto').files[0]; if(f){const r=ref(storage,`avatars/${state.user.uid}/${Date.now()}-${f.name}`);await uploadBytes(r,f);photoURL=await getDownloadURL(r);} await updateProfile(state.user,{displayName:name,photoURL}); await updateDoc(doc(db,'users',state.user.uid),{displayName:name,displayNameLower:name.toLowerCase(),username,usernameLower:username,bio,photoURL});state.profile={...state.profile,displayName:name,username,bio,photoURL};renderProfile();closeModal();toast('Профиль обновлён.')}catch(e){toast(e.message,true)}}
    function privacySettings(){const p=state.profile.privacy||{}; modal('Конфиденциальность',`<div><div class="setting"><div><b>Время последнего посещения</b><span>Кто видит вашу активность</span></div><select id="lastSeen" style="width:145px"><option value="everyone" ${p.lastSeen==='everyone'?'selected':''}>Все</option><option value="contacts" ${p.lastSeen==='contacts'?'selected':''}>Контакты</option><option value="nobody" ${p.lastSeen==='nobody'?'selected':''}>Никто</option></select></div><div class="setting"><div><b>Фото профиля</b><span>Кому видно изображение</span></div><select id="profilePhoto" style="width:145px"><option value="everyone" ${p.profilePhoto==='everyone'?'selected':''}>Все</option><option value="contacts" ${p.profilePhoto==='contacts'?'selected':''}>Контакты</option><option value="nobody" ${p.profilePhoto==='nobody'?'selected':''}>Никто</option></select></div><div class="setting"><div><b>Прочитанные сообщения</b><span>Показывать статус прочтения</span></div><button id="readToggle" class="toggle ${p.readReceipts!==false?'on':''}"></button></div><div class="setting"><div><b>Пересылка</b><span>Кто может пересылать ваши сообщения</span></div><select id="forwarding" style="width:145px"><option value="everyone" ${p.forwarding==='everyone'?'selected':''}>Все</option><option value="contacts" ${p.forwarding==='contacts'?'selected':''}>Контакты</option><option value="nobody" ${p.forwarding==='nobody'?'selected':''}>Никто</option></select></div></div>`,`<button class="primary" id="privacySave">Сохранить</button>`); $('#readToggle').onclick=e=>e.currentTarget.classList.toggle('on'); $('#privacySave').onclick=async()=>{const privacy={lastSeen:$('#lastSeen').value,profilePhoto:$('#profilePhoto').value,forwarding:$('#forwarding').value,readReceipts:$('#readToggle').classList.contains('on')};await updateDoc(doc(db,'users',state.user.uid),{privacy});state.profile.privacy=privacy;closeModal();toast('Настройки конфиденциальности сохранены.')}; }
    async function notificationSettings(){const key='burmalgram_notifications';const curr=JSON.parse(localStorage.getItem(key)||'{"messages":true,"groups":true,"sounds":true}'); modal('Уведомления',`<div class="setting"><div><b>Личные сообщения</b><span>Показывать уведомления</span></div><button class="toggle ${curr.messages?'on':''}" data-k="messages"></button></div><div class="setting"><div><b>Группы и каналы</b><span>Показывать уведомления</span></div><button class="toggle ${curr.groups?'on':''}" data-k="groups"></button></div><div class="setting"><div><b>Звуки</b><span>Звуковые сигналы</span></div><button class="toggle ${curr.sounds?'on':''}" data-k="sounds"></button></div>`,`<button class="primary" id="notifySave">Сохранить</button>`); $$('[data-k]').forEach(b=>b.onclick=()=>b.classList.toggle('on')); $('#notifySave').onclick=()=>{const x={};$$('[data-k]').forEach(b=>x[b.dataset.k]=b.classList.contains('on'));localStorage.setItem(key,JSON.stringify(x));closeModal();toast('Настройки уведомлений сохранены.');}; }
    async function blockedUsers(){const ids=[...state.blocked];const people=[];for(const id of ids){const s=await getDoc(doc(db,'users',id));if(s.exists())people.push({id,...s.data()});}modal('Заблокированные',people.length?people.map(p=>`<div class="chatitem" style="padding:10px 0">${avatarHtml(p)}<div class="grow"><b>${esc(p.displayName)}</b><div style="color:var(--muted);font-size:12px">@${esc(p.username)}</div></div><button class="secondary" data-unblock="${p.id}">Разблокировать</button></div>`).join(''):'<div style="color:var(--muted)">Список пуст.</div>');$$('[data-unblock]').forEach(b=>b.onclick=()=>unblock(b.dataset.unblock));}
    async function unblock(uid){state.blocked.delete(uid);await updateDoc(doc(db,'users',state.user.uid),{blocked:[...state.blocked]});closeModal();subscribeChats();toast('Пользователь разблокирован.');}
    function chatInfo(){ if(!state.activeChat)return;const c=state.activeChat; if(c.type==='dm'){const uid=c.members.find(x=>x!==state.user.uid);const p=state.usersCache.get(uid); modal(chatTitle(c),`<div class="formgrid">${avatarHtml(p)}<div><b>@${esc(p?.username||'user')}</b><div style="color:var(--muted);margin-top:5px">${esc(p?.bio||'Нет описания')}</div></div><div class="divider"></div><button class="danger" id="blockBtn">Заблокировать пользователя</button><button class="secondary" id="deleteChat">Удалить локальный чат из списка</button></div>`);$('#blockBtn').onclick=()=>blockUser(uid);$('#deleteChat').onclick=()=>{closeModal();toast('Удаление чата можно добавить через серверное архивирование.');};} else modal(c.name||'Сообщество',`<div style="color:var(--muted)">${esc(c.description||'Без описания')}</div><div class="divider"></div><div class="setting"><div><b>Участники</b><span>${c.members?.length||1}</span></div></div>${c.ownerId===state.user.uid?'<div class="setting"><div><b>Права</b><span>Вы владелец этого пространства</span></div></div>':''}`);}
    async function blockUser(uid){state.blocked.add(uid);await updateDoc(doc(db,'users',state.user.uid),{blocked:[...state.blocked]});closeModal();toast('Пользователь заблокирован.');state.activeChat=null;if(state.messagesUnsub)state.messagesUnsub();renderHeader();subscribeChats();}

    $('#newChatBtn').onclick=newChat; $('#settingsBtn').onclick=settings; $('#chatInfoBtn').onclick=chatInfo; $('#backBtn').onclick=()=>document.body.querySelector('#app').classList.remove('chatopen'); $('#searchInput').oninput=e=>{state.search=e.target.value;renderChatList()}; $$('.chip').forEach(b=>b.onclick=()=>{$$('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.filter=b.dataset.filter;renderChatList()}); $('#messageInput').addEventListener('input',()=>{$('#sendBtn').disabled=!$('#messageInput').value.trim()||$('#messageInput').disabled;$('#messageInput').style.height='auto';$('#messageInput').style.height=Math.min($('#messageInput').scrollHeight,130)+'px'}); $('#messageInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage()}}); $('#sendBtn').onclick=sendMessage; $('#attachBtn').onclick=()=>toast('В этой версии поле вложений подготовлено. Файлы можно подключить через Firebase Storage.'); $('#searchChatBtn').onclick=()=>toast('Поиск по текущему чату можно расширить через Firestore full-text индекс.');
  </script>
</body>
</html>
